<p class="fig-title" id="fig-romney-lessons-t">Romney's lessons link in a chain, from choosing partners to acting with courage.</p>
<p class="fig-sub">Six lessons as Romney told them, in the order I link them. Copper marks the one he kept coming back to: partners.</p>

<figcaption>Paraphrased from Romney's opening keynote at the HBS ETA Conference. The links between steps are my reading, not his. These are his stories as he told them, not a fact-check of each one.</figcaption>
<script>
(function () {
  var fig = document.getElementById('fig-romney-lessons');
  if (!fig) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !('IntersectionObserver' in window) || !fig.animate) return;
  var steps = fig.querySelectorAll('.step');
  var links = fig.querySelectorAll('.link');
  fig.classList.add('armed');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      io.disconnect();
      play();
    });
  }, { threshold: 0.2 });
  io.observe(fig);
  function play() {
    var gap = 520;
    steps.forEach(function (s, i) {
      s.animate(
        [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'translateY(0)' }],
        { duration: 420, delay: i * gap, easing: 'ease-out', fill: 'both' }
      );
      var l = links[i];
      if (l) {
        var d = i * gap + 320;
        l.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, delay: d, fill: 'both' });
        var line = l.querySelector('.ln');
        if (line) {
          line.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 260, delay: d, easing: 'ease-out', fill: 'both' });
        }
      }
    });
  }
})();
</script>
