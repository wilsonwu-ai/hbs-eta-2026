<figure class="fig" id="fig-guild-playbook" aria-labelledby="fig-guild-playbook-t">
<p class="fig-title" id="fig-guild-playbook-t">Dubin's order of work: a short desk check, many owner talks, then the best operators and a team.</p>
<p class="fig-sub">Six steps from his advice, top to bottom. The copper step was the main takeaway for me.</p>
<style>
#fig-guild-playbook text{font-family:inherit}
#fig-guild-playbook .h{font-size:15px;font-weight:700;fill:var(--w-navy)}
#fig-guild-playbook .s{font-size:14px;fill:var(--w-muted)}
#fig-guild-playbook .num{font-size:15px;font-weight:700;fill:var(--w-surface);text-anchor:middle}
#fig-guild-playbook .rail{stroke:var(--w-line-strong);stroke-width:3}
</style>
<svg viewBox="0 0 360 520" role="img" aria-label="Dubin's six steps. One: keep desk research short, not zero but never for months. Two: run a sourcing sprint, a short push of 20 to 30 owner conversations over 2 to 3 months. Three: let owners pick the category; pool service out, home trades such as heating and cooling in. Four: map the industry's leaders and narrow 10,000 firms to a top 100. Five: back great operators first and let them keep a big ownership stake. Six: hire the team before the deals, a CEO first, then heads of accounting and HR.">
  <line class="rail" x1="28" y1="30" x2="28" y2="430"/>

  <circle cx="28" cy="30" r="15" fill="var(--w-navy)"/>
  <text class="num" x="28" y="35">1</text>
  <text class="h" x="58" y="35">Keep desk research short</text>
  <text class="s" x="58" y="56">Not zero, but never for months.</text>

  <circle cx="28" cy="110" r="15" fill="var(--w-accent)"/>
  <text class="num" x="28" y="115">2</text>
  <text class="h" x="58" y="115">Run a sourcing sprint</text>
  <text class="s" x="58" y="136">A short push: 20 to 30 owners,</text>
  <text class="s" x="58" y="154">over 2 to 3 months.</text>

  <circle cx="28" cy="190" r="15" fill="var(--w-navy)"/>
  <text class="num" x="28" y="195">3</text>
  <text class="h" x="58" y="195">Let owners pick the category</text>
  <text class="s" x="58" y="216">Pool service: out. Home trades</text>
  <text class="s" x="58" y="234">like heating and cooling: in.</text>

  <circle cx="28" cy="270" r="15" fill="var(--w-navy)"/>
  <text class="num" x="28" y="275">4</text>
  <text class="h" x="58" y="275">Map the leaders, aim high</text>
  <text class="s" x="58" y="296">Narrow 10,000 firms to a top 100,</text>
  <text class="s" x="58" y="314">not a mass email.</text>

  <circle cx="28" cy="350" r="15" fill="var(--w-navy)"/>
  <text class="num" x="28" y="355">5</text>
  <text class="h" x="58" y="355">Back great operators first</text>
  <text class="s" x="58" y="376">Let them keep a big ownership</text>
  <text class="s" x="58" y="394">stake. Be a caring partner.</text>

  <circle cx="28" cy="430" r="15" fill="var(--w-navy)"/>
  <text class="num" x="28" y="435">6</text>
  <text class="h" x="58" y="435">Hire the team before the deals</text>
  <text class="s" x="58" y="456">A CEO first, then heads of</text>
  <text class="s" x="58" y="474">accounting and HR, before deal one.</text>
</svg>
<figcaption>From Jordan Dubin's keynote at the HBS ETA Conference 2026. The advice is his, paraphrased; the numbered order is mine.</figcaption>
</figure>
