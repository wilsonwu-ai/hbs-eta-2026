<figure class="fig" id="fig-sba-stack" aria-labelledby="fig-sba-stack-t">

<p class="fig-title" id="fig-sba-stack-t">The SBA loan is the base of every stack, and at least 5% of the price on top is the buyer's own cash.</p>
<p class="fig-sub">Three ways to fund the same $2,000,000 purchase, read from the bottom up. The SBA loan is a bank loan that the SBA partly guarantees. Full standby means the seller gets no payments while that loan lasts. DSCR is how many times the business's cash flow covers its loan payments.</p>
<svg viewBox="0 0 360 410" role="img" aria-label="Three stacks that each add up to a $2,000,000 purchase. Base case: an SBA loan of $1,800,000 (90%), a seller note of $100,000 (5%) on full standby, and buyer cash of $100,000 (5%). With an investor: the same loan and cash, but a $100,000 (5%) investor layer replaces the seller note. Bigger seller note: an SBA loan of $1,600,000 (80%), a $200,000 (10%) seller note that counts in the DSCR test, a $100,000 (5%) seller note on full standby, and buyer cash of $100,000 (5%). Illustrative numbers, heights not to scale.">

  <!-- Stack A: base case (x 6 to 114) -->
  <g>
    <rect class="loan" x="6" y="208" width="108" height="120" rx="6"/>
    <text class="on-dark b" x="60" y="264" text-anchor="middle">SBA loan</text>
    <text class="on-dark" x="60" y="282" text-anchor="middle">$1,800,000</text>
    <text class="on-dark" x="60" y="300" text-anchor="middle">90%</text>

    <rect class="note" x="6" y="144" width="108" height="64" rx="6"/>
    <text class="on-light b" x="60" y="162" text-anchor="middle">Seller note</text>
    <text class="on-light" x="60" y="180" text-anchor="middle">$100,000, 5%</text>
    <text class="on-light" x="60" y="198" text-anchor="middle">full standby</text>

    <rect class="cash" x="6" y="80" width="108" height="64" rx="6"/>
    <text class="on-dark b" x="60" y="98" text-anchor="middle">Your cash</text>
    <text class="on-dark" x="60" y="116" text-anchor="middle">$100,000, 5%</text>
    <text class="on-dark" x="60" y="134" text-anchor="middle">own money</text>
  </g>

  <!-- Stack B: with an investor (x 126 to 234) -->
  <g>
    <rect class="loan" x="126" y="208" width="108" height="120" rx="6"/>
    <text class="on-dark b" x="180" y="264" text-anchor="middle">SBA loan</text>
    <text class="on-dark" x="180" y="282" text-anchor="middle">$1,800,000</text>
    <text class="on-dark" x="180" y="300" text-anchor="middle">90%</text>

    <rect class="inv" x="126" y="144" width="108" height="64" rx="6"/>
    <text class="on-light b" x="180" y="162" text-anchor="middle">Investor</text>
    <text class="on-light" x="180" y="180" text-anchor="middle">$100,000, 5%</text>
    <text class="on-light" x="180" y="198" text-anchor="middle">tax payouts</text>

    <rect class="cash" x="126" y="80" width="108" height="64" rx="6"/>
    <text class="on-dark b" x="180" y="98" text-anchor="middle">Your cash</text>
    <text class="on-dark" x="180" y="116" text-anchor="middle">$100,000, 5%</text>
    <text class="on-dark" x="180" y="134" text-anchor="middle">own money</text>
  </g>

  <!-- Stack C: bigger seller note (x 246 to 354) -->
  <g>
    <rect class="loan" x="246" y="224" width="108" height="104" rx="6"/>
    <text class="on-dark b" x="300" y="272" text-anchor="middle">SBA loan</text>
    <text class="on-dark" x="300" y="290" text-anchor="middle">$1,600,000</text>
    <text class="on-dark" x="300" y="308" text-anchor="middle">80%</text>

    <rect class="note-flow" x="246" y="144" width="108" height="80" rx="6"/>
    <text class="on-light b" x="300" y="170" text-anchor="middle">Seller note</text>
    <text class="on-light" x="300" y="188" text-anchor="middle">$200,000, 10%</text>
    <text class="on-light" x="300" y="206" text-anchor="middle">in the DSCR</text>

    <rect class="note" x="246" y="80" width="108" height="64" rx="6"/>
    <text class="on-light b" x="300" y="98" text-anchor="middle">Seller note</text>
    <text class="on-light" x="300" y="116" text-anchor="middle">$100,000, 5%</text>
    <text class="on-light" x="300" y="134" text-anchor="middle">full standby</text>

    <rect class="cash" x="246" y="16" width="108" height="64" rx="6"/>
    <text class="on-dark b" x="300" y="34" text-anchor="middle">Your cash</text>
    <text class="on-dark" x="300" y="52" text-anchor="middle">$100,000, 5%</text>
    <text class="on-dark" x="300" y="70" text-anchor="middle">own money</text>
  </g>

  <line class="base" x1="6" y1="329" x2="354" y2="329"/>

  <text class="head" x="60" y="352" text-anchor="middle">Base case</text>
  <text class="head" x="180" y="352" text-anchor="middle">Investor</text>
  <text class="head" x="300" y="352" text-anchor="middle">Bigger note</text>

  <text class="muted" x="180" y="380" text-anchor="middle">Each stack adds up to the same</text>
  <text class="muted" x="180" y="398" text-anchor="middle">$2,000,000 price. Heights not to scale.</text>
</svg>
<figcaption>Illustrative round numbers, not a quote or advice. Closing costs are left out to keep the math simple. In the investor stack, an investor who funds part of the 10% down can be paid only tax distributions until the loan is paid off (<a href="https://joinaccredited.com/blog/sba-sop-50-10-8-1-acquisition-rules">Accredited summary</a>). A seller note above the 10% that is not on full standby for the loan's life must be counted in the DSCR test, per Brendan O'Brien, a lender on the panel. Rules are in SOP 50 10 8.1; confirm with your lender.</figcaption>
</figure>
