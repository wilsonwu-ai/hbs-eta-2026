<figcaption>Illustrative: bar lengths show the shift in emphasis, not Dubin's own numbers. The 20 to 30 conversations over 2 to 3 months and the pool service example are from his keynote, as I understood it.</figcaption>
<script>
(function () {
  var fig = document.getElementById('fig-guild-desk-vs-field');
  if (!fig) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !('IntersectionObserver' in window) || !fig.animate) return;
  var desk = fig.querySelector('.bar-desk');
  var field = fig.querySelector('.bar-field');
  var dots = fig.querySelectorAll('.dot');
  var i;
  desk.style.transform = 'scaleX(4)';
  field.style.transform = 'scaleX(0.25)';
  for (i = 0; i < dots.length; i++) dots[i].style.opacity = '0';
  var played = false;
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting && !played) { played = true; io.disconnect(); play(); }
    });
  }, { threshold: 0.4 });
  io.observe(fig);
  function play() {
    var ease = 'cubic-bezier(.2,.7,.2,1)';
    var a = desk.animate([{ transform: 'scaleX(4)' }, { transform: 'scaleX(1)' }], { duration: 1600, delay: 400, easing: ease, fill: 'both' });
    var b = field.animate([{ transform: 'scaleX(0.25)' }, { transform: 'scaleX(1)' }], { duration: 1600, delay: 400, easing: ease, fill: 'both' });
    a.onfinish = function () { desk.style.transform = 'scaleX(1)'; };
    b.onfinish = function () { field.style.transform = 'scaleX(1)'; };
    Array.prototype.forEach.call(dots, function (d, k) {
      var an = d.animate([{ opacity: 0, transform: 'scale(0.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 300, delay: 1000 + k * 45, easing: 'ease-out', fill: 'both' });
      an.onfinish = function () { d.style.opacity = '1'; };
    });
  }
})();
</script>
