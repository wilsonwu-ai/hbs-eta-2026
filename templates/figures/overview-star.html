<p class="fig-title" id="fig-overview-star-t">I was invited, I went to learn, and I came home sure it is possible.</p>
<p class="fig-sub">Each article follows the same four steps. This is the whole day in one picture.</p>
<svg viewBox="0 0 360 670" role="img" aria-label="Four steps from top to bottom. Where I was sitting: Luke Tatone of Searchfunder invited me to Harvard Business School's 12th annual conference on buying a business, on Saturday 14 November 2026. What I went to learn: attend as many sessions as I could and learn from people who have done it. What I did: I attended four sessions and wrote them up. What I am taking home: four articles and one message, that it is possible, and here is how others did it.">

  <!-- 1 Situation -->
  <rect class="card" x="10" y="10" width="340" height="142" rx="10"/>
  <text class="lb" x="26" y="34">Situation</text>
  <text class="hd" x="26" y="56">Where I was sitting</text>
  <text class="bd" x="26" y="80">Luke Tatone of Searchfunder invited me</text>
  <text class="bd" x="26" y="99">to Harvard Business School's 12th</text>
  <text class="bd" x="26" y="118">annual conference on buying a business,</text>
  <text class="bd" x="26" y="137">Saturday 14 November 2026.</text>
  <line class="ar" x1="180" y1="156" x2="180" y2="166"/>
  <polygon class="ah" points="173,165 187,165 180,175"/>

  <!-- 2 Task -->
  <rect class="card" x="10" y="178" width="340" height="142" rx="10"/>
  <text class="lb" x="26" y="202">Task</text>
  <text class="hd" x="26" y="224">What I went to learn</text>
  <text class="bd" x="26" y="248">Go to as many sessions as I could.</text>
  <text class="bd" x="26" y="267">Learn from people who have done it.</text>
  <text class="bd" x="26" y="286">I write for searchers like me, asking</text>
  <text class="bd" x="26" y="305">how to pay for a business.</text>
  <line class="ar" x1="180" y1="324" x2="180" y2="334"/>
  <polygon class="ah" points="173,333 187,333 180,343"/>

  <!-- 3 Action -->
  <rect class="card" x="10" y="346" width="340" height="142" rx="10"/>
  <text class="lb" x="26" y="370">Action</text>
  <text class="hd" x="26" y="392">What I did</text>
  <text class="bd" x="26" y="416">I attended four sessions: Mitt Romney,</text>
  <text class="bd" x="26" y="435">SBA financing, Guild Garage, roll-ups.</text>
  <text class="bd" x="26" y="454">I met people there, and wrote it all up</text>
  <text class="bd" x="26" y="473">as I understood it.</text>
  <line class="ar" x1="180" y1="492" x2="180" y2="502"/>
  <polygon class="ah" points="173,501 187,501 180,511"/>

  <!-- 4 Result -->
  <rect class="end" x="10" y="514" width="340" height="142" rx="10"/>
  <text class="on-l" x="26" y="538">Result</text>
  <text class="on-b" x="26" y="560">What I am taking home</text>
  <text class="on bd" x="26" y="584" style="fill:var(--w-surface)">Four articles, one for each session.</text>
  <text class="bd" x="26" y="603" style="fill:var(--w-surface)">One message under all of them:</text>
  <text class="bd" x="26" y="622" style="fill:var(--w-surface)">it is possible, and here is how</text>
  <text class="bd" x="26" y="641" style="fill:var(--w-surface)">others did it.</text>
</svg>
<figcaption>Illustrative summary of how the day and this series are laid out. Based on my day at the conference, Saturday 14 November 2026.</figcaption>
