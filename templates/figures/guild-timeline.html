<figure class="fig" id="fig-guild-timeline" aria-labelledby="fig-guild-timeline-t">
<p class="fig-title" id="fig-guild-timeline-t">Jordan Dubin went from a first-semester start to a new platform in under three years.</p>
<p class="fig-sub">Read from top to bottom. Each dot is a dated step in his story.</p>
<style>
#fig-guild-timeline text{font-family:inherit}
#fig-guild-timeline .d{font-size:16px;font-weight:700;fill:var(--w-accent)}
#fig-guild-timeline .h{font-size:15px;font-weight:700;fill:var(--w-navy)}
#fig-guild-timeline .s{font-size:14px;fill:var(--w-muted)}
#fig-guild-timeline .n{font-size:14px;fill:var(--w-ink)}
#fig-guild-timeline .rail{stroke:var(--w-line-strong);stroke-width:3}
</style>
<svg viewBox="0 0 360 520" role="img" aria-label="Timeline of Jordan Dubin's ventures. September 2023: Guild Garage Group starts in his first semester at Harvard Business School, as Royce Yudkoff told it. 2025: Galaxy Service Partners, for commercial doors and gates. 1 April 2026: Oak Hill, an investment firm, announces a partnership with Guild. 10 August 2026: 599 Holdings launches Titan Trades Alliance. That is under three years from first start to new platform. Yudkoff introduced Guild as north of $350 million in revenue, a figure I could not confirm.">
  <line class="rail" x1="32" y1="30" x2="32" y2="354"/>

  <circle cx="32" cy="30" r="10" fill="var(--w-navy)"/>
  <text class="d" x="60" y="35">Sept 2023</text>
  <text class="h" x="60" y="57">Guild Garage Group starts</text>
  <text class="s" x="60" y="77">Yudkoff said this was his</text>
  <text class="s" x="60" y="95">first semester at HBS.</text>

  <circle cx="32" cy="138" r="10" fill="var(--w-navy)"/>
  <text class="d" x="60" y="143">2025</text>
  <text class="h" x="60" y="165">Galaxy Service Partners</text>
  <text class="s" x="60" y="185">Commercial doors and gates.</text>
  <text class="s" x="60" y="203">Yudkoff placed it in his last term.</text>

  <circle cx="32" cy="246" r="10" fill="var(--w-navy)"/>
  <text class="d" x="60" y="251">1 Apr 2026</text>
  <text class="h" x="60" y="273">Oak Hill partners with Guild</text>
  <text class="s" x="60" y="293">An investment firm joins in.</text>
  <text class="s" x="60" y="311">Managers keep a significant stake.</text>

  <circle cx="32" cy="354" r="10" fill="var(--w-accent)"/>
  <text class="d" x="60" y="359">10 Aug 2026</text>
  <text class="h" x="60" y="381">Titan Trades Alliance launches</text>
  <text class="s" x="60" y="401">From 599 Holdings: home heating,</text>
  <text class="s" x="60" y="419">cooling, plumbing and electrical.</text>

  <rect x="16" y="436" width="328" height="82" rx="6" fill="var(--w-accent-tint)" stroke="var(--w-line-strong)"/>
  <text class="n" x="30" y="460">Yudkoff introduced Guild with revenue</text>
  <text class="n" x="30" y="480">north of $350M. I could not confirm</text>
  <text class="n" x="30" y="500">that exact figure in public sources.</text>
</svg>
<figcaption>Sources: Royce Yudkoff's introduction in the keynote (Guild, Galaxy and Oak Hill timing, as he told it); ServiceTitan (Galaxy founded 2025); Paul Weiss (Oak Hill announcement, 1 April 2026); BriefGlance (Titan launch, 10 August 2026).</figcaption>
</figure>
