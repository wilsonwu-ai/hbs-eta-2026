<p class="fig-title" id="fig-rollups-paths-t">There are five roads into buying a business, and this panel walked all five</p>
<p class="fig-sub">It plays once as you scroll. Each card says what the road is and who on the panel took it. The copper one was new to me.</p>
<svg viewBox="0 0 360 556" role="img" aria-label="Five roads into buying a business, each with who on the panel took it. One: self-funded search, where you pay for the search yourself then raise money for the deal, and 4 of the 5 panelists started here. Two: traditional search fund, where investors back you while you search, taken by Tibbs. Three: fund-backed CEO, where a fund backs the company and you run it, taken by Caldwell with Shore Capital, and the one that was new to me. Four: independent sponsor, where you find a deal first then raise money for that one deal, which Porter did before his fund. Five: holding company, where you buy companies and keep them long term, taken by Fong.">

<figcaption>From the panel, Notes from the HBS ETA Conference 2026. The plain-word descriptions are mine. Who took each road comes from the panelists' own stories. Some panelists changed roads along the way, so one person can appear in more than one place across my understanding.</figcaption>
<script>
(function () {
  var fig = document.getElementById('fig-rollups-paths');
  if (!fig || !fig.animate) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!('IntersectionObserver' in window)) return;

  var steps = Array.prototype.slice.call(fig.querySelectorAll('.step'));
  var trunk = fig.querySelector('.trunk');

  steps.forEach(function (s) { s.style.opacity = '0'; });
  trunk.style.strokeDasharray = '1';
  trunk.style.strokeDashoffset = '1';

  var played = false;
  function play() {
    if (played) return;
    played = true;
    var total = 400 + steps.length * 520;
    var line = trunk.animate(
      [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
      { duration: total, easing: 'linear', fill: 'forwards' }
    );
    line.onfinish = function () {
      trunk.style.strokeDashoffset = '0';
    };
    steps.forEach(function (s, i) {
      var a = s.animate(
        [
          { opacity: 0, transform: 'translateY(10px)' },
          { opacity: 1, transform: 'translateY(0)' }
        ],
        { duration: 450, delay: 200 + i * 520, easing: 'ease-out', fill: 'both' }
      );
      a.onfinish = function () { s.style.opacity = '1'; };
    });
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { play(); io.disconnect(); }
    });
  }, { threshold: 0.3 });
  io.observe(fig);
})();
</script>
</figure>
