<figure class="fig" id="fig-romney-timeline" aria-labelledby="fig-romney-timeline-t">
<style>
#fig-romney-timeline svg{display:block;width:100%;height:auto;max-width:420px;margin:0 auto}
#fig-romney-timeline .yr{fill:var(--w-ink);font-size:15px;font-weight:700;text-anchor:end}
#fig-romney-timeline .hd{fill:var(--w-ink);font-size:15px;font-weight:700}
#fig-romney-timeline .dt{fill:var(--w-muted);font-size:14px}
#fig-romney-timeline .spine{stroke:var(--w-line-strong);stroke-width:2}

<p class="fig-title" id="fig-romney-timeline-t">Romney moved between business and public life more than once.</p>
<p class="fig-sub">Read top to bottom. Navy dots mark business, copper dots mark public life.</p>
<svg viewBox="0 0 360 572" role="img" aria-label="Timeline of Mitt Romney's career. 1977: joins Bain and Company, vice president by 1978, after the Boston Consulting Group. 1984: leaves to co-found Bain Capital, whose first fund was $37M. 1999 to 2002: runs the 2002 Winter Olympics in Salt Lake City. 2003 to 2007: Governor of Massachusetts. 2008: Solamere Capital is formed, per its own site. 2019 to 2025: US Senator from Utah. Business chapters are navy, public life chapters are copper.">
  <line class="spine" x1="94" y1="28" x2="94" y2="468"/>

  <g>
    <text class="yr" x="80" y="33">1977</text>
    <circle class="biz" cx="94" cy="28" r="8"/>
    <text class="hd" x="114" y="33">Joins Bain &amp; Company</text>
    <text class="dt" x="114" y="53">Vice president by 1978</text>
    <text class="dt" x="114" y="73">Boston Consulting Group first</text>
  </g>

  <g>
    <text class="yr" x="80" y="121">1984</text>
    <circle class="biz" cx="94" cy="116" r="8"/>
    <text class="hd" x="114" y="121">Co-founds Bain Capital</text>
    <text class="dt" x="114" y="141">Leaves Bain &amp; Company</text>
    <text class="dt" x="114" y="161">First fund: $37M</text>
  </g>

  <g>
    <text class="yr" x="80" y="209">1999</text>
    <text class="yr" x="80" y="227">to 2002</text>
    <circle class="pub" cx="94" cy="204" r="8"/>
    <text class="hd" x="114" y="209">Salt Lake City Olympics</text>
    <text class="dt" x="114" y="229">Runs the 2002 Winter Games</text>
    <text class="dt" x="114" y="249">Purpose over money, he said</text>
  </g>

  <g>
    <text class="yr" x="80" y="297">2003</text>
    <text class="yr" x="80" y="315">to 2007</text>
    <circle class="pub" cx="94" cy="292" r="8"/>
    <text class="hd" x="114" y="297">Governor of Massachusetts</text>
    <text class="dt" x="114" y="317">He stressed data and boldness</text>
  </g>

  <g>
    <text class="yr" x="80" y="385">2008</text>
    <circle class="biz" cx="94" cy="380" r="8"/>
    <text class="hd" x="114" y="385">Solamere Capital formed</text>
    <text class="dt" x="114" y="405">Firm formed 2008, per its site</text>
    <text class="dt" x="114" y="425">He cited about 300 investors</text>
  </g>

  <g>
    <text class="yr" x="80" y="473">2019</text>
    <text class="yr" x="80" y="491">to 2025</text>
    <circle class="pub" cx="94" cy="468" r="8"/>
    <text class="hd" x="114" y="473">US Senator from Utah</text>
    <text class="dt" x="114" y="493">Valued working across the aisle</text>
  </g>

  <circle class="biz" cx="20" cy="545" r="7"/>
  <text class="lg" x="34" y="550">Business</text>
  <circle class="pub" cx="140" cy="545" r="7"/>
  <text class="lg" x="154" y="550">Public life</text>
</svg>
<figcaption>Dates and the $37M first fund are public record, from Wikipedia's pages on <a href="https://en.wikipedia.org/wiki/Mitt_Romney">Romney</a> and <a href="https://en.wikipedia.org/wiki/Business_career_of_Mitt_Romney">his business career</a>. Solamere's 2008 formation is from <a href="https://www.solamere.com">its own site</a>. The remarks beside each chapter are Romney's, as I recall them from the room.</figcaption>
</figure>
